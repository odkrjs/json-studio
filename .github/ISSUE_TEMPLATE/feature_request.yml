name: Feature request
description: Suggest an improvement or a new workflow for JSON Studio
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea. Please describe the workflow and the problem, not only the proposed UI.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish, and where does the current app fall short?
      placeholder: "I compare large API payloads and need ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like. Mockups or examples are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing tools, workarounds, or other designs you have tried.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Format / tree view
        - Semantic compare
        - Unescape String
        - File import
        - Editor / input
        - Native menu / window
        - Packaging / installation
        - Documentation
        - Other
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and discussions for similar ideas.
          required: true
        - label: I agree to follow the Code of Conduct.
          required: true
