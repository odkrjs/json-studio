name: Release

on:
  push:
    tags:
      - "v*"
permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run core tests
        run: node --test tests/core.test.js

      - name: Build release archive
        run: ./make-release.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.zip \
            dist/*.sha256 \
            --title "JSON Studio ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
